<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Games Hub</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 42px 20px;
    background: #f1f4f7;
    font-family: Arial, Helvetica, sans-serif;
    color: #2d2d2d;
  }

  .panel {
    width: min(975px, 100%);
    margin: 0 auto;
    background: #ffffff;
    border-radius: 30px;
    box-shadow: 0 18px 45px rgba(32, 45, 60, 0.12);
    padding: 58px 60px 60px;
    text-align: center;
  }

  .brand {
    margin: 0;
    color: #2459b8;
    font-size: clamp(2.5rem, 5vw, 3.3rem);
    line-height: 1.05;
    font-weight: 800;
  }

  .title {
    margin: 18px 0 0;
    font-size: clamp(1.65rem, 4vw, 2.25rem);
    line-height: 1.2;
    font-weight: 400;
  }

  .buttons {
    display: grid;
    gap: 27px;
    margin-top: 56px;
  }

  .button {
    width: 100%;
    min-height: 109px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 17px;
    padding: 22px 28px;
    border-radius: 20px;
    color: white !important;
    text-decoration: none !important;
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 800;
    transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
  }

  .button:hover {
    transform: translateY(-3px);
    filter: brightness(1.04);
    box-shadow: 0 9px 20px rgba(0,0,0,.14);
  }

  .green { background: #7cab70; }
  .gold  { background: #b58a49; }
  .blue  { background: #4b7fe3; }
  .navy  { background: #416db8; }
  .purple { background: #7b6eb2; }

  .square {
    width: 32px;
    height: 32px;
    display: inline-block;
    flex: 0 0 32px;
    border-radius: 6px;
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.35),
      inset 0 -2px 4px rgba(0,0,0,.16),
      0 2px 5px rgba(0,0,0,.15);
  }

  .green-square {
    background: linear-gradient(135deg, #62cf9a, #4ba576);
  }

  .brown-square {
    background: linear-gradient(135deg, #8f6270, #694552);
  }

  .blue-circle {
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7da9e3, #365fa9 70%);
  }

  .note {
    margin: 49px 0 0;
    color: #555;
    font-size: 1.08rem;
  }

  .back {
    display: block;
    width: fit-content;
    margin: 0 0 27px;
    color: #2459b8;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
  }

  .back:hover { text-decoration: underline; }

  @media (max-width: 650px) {
    body { padding: 18px 12px; }
    .panel {
      padding: 38px 20px 42px;
      border-radius: 23px;
    }
    .buttons {
      margin-top: 42px;
      gap: 19px;
    }
    .button {
      min-height: 90px;
      border-radius: 18px;
      padding: 18px;
    }
    .square {
      width: 27px;
      height: 27px;
      flex-basis: 27px;
    }
  }
</style>

</head>
<body>
  <main class="panel">
    <h1 class="brand">UNSW Anatomy</h1>
    <h2 class="title">Anatomy Games Hub</h2>

    <div class="buttons">
      <a class="button green" href="hma.html">HMA</a>
      <a class="button blue" href="aeb.html">AEB</a>
    </div>

    <p class="note">Choose a course to begin.</p>
  </main>
</body>
</html>
