<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MSK of the Thorax Games</title><style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:42px 20px;background:#f1f4f7;font-family:Arial,Helvetica,sans-serif;color:#2d2d2d}
.panel{width:min(975px,100%);margin:0 auto;background:#fff;border-radius:30px;box-shadow:0 18px 45px rgba(32,45,60,.12);padding:58px 60px 60px;text-align:center}
.brand{margin:0;color:#2459b8;font-size:clamp(2.5rem,5vw,3.3rem);font-weight:800}
.title{margin:18px 0 0;font-size:clamp(1.65rem,4vw,2.25rem);font-weight:400}
.buttons{display:grid;gap:22px;margin-top:56px}
.button{width:100%;min-height:100px;display:flex;align-items:center;justify-content:center;gap:17px;padding:22px 28px;border-radius:20px;color:white!important;text-decoration:none!important;font-size:clamp(1.45rem,3vw,1.95rem);font-weight:800;transition:transform .15s ease,filter .15s ease,box-shadow .15s ease}
.button:hover{transform:translateY(-3px);filter:brightness(1.04);box-shadow:0 9px 20px rgba(0,0,0,.14)}
.green{background:#7cab70}.gold{background:#b58a49}.blue{background:#4b7fe3}.purple{background:#7f69b5}.red{background:#c96767}.teal{background:#4c9a98}.orange{background:#d48a46}.slate{background:#65758b}
.icon{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 32px;border-radius:7px;background:rgba(255,255,255,.22);box-shadow:inset 0 1px 2px rgba(255,255,255,.25),0 2px 5px rgba(0,0,0,.12);font-size:.82rem;font-weight:900}
.circle{border-radius:50%}
.note{margin:49px 0 0;color:#555;font-size:1.08rem}
.back{display:block;width:fit-content;margin:0 0 27px;color:#2459b8;text-decoration:none;font-weight:700}
.back:hover{text-decoration:underline}
@media(max-width:650px){body{padding:18px 12px}.panel{padding:38px 20px 42px;border-radius:23px}.buttons{margin-top:42px;gap:16px}.button{min-height:86px;border-radius:18px;padding:18px}.icon{width:28px;height:28px;flex-basis:28px}}
</style></head><body>
<main class="panel"><a class="back" href="sh.html">← Society and Health Games</a><h1 class="brand">UNSW Anatomy</h1><h2 class="title">MSK of the Thorax Games</h2>
<div class="buttons">
<a class="button green" href="https://medanatomyunsw.github.io/SH_MSKThorax_Wordle/"><span class="icon">W</span>Wordle</a>
<a class="button gold" href="https://medanatomyunsw.github.io/SH_MSKThorax_Connections/"><span class="icon">4×4</span>Connections</a>
<a class="button blue" href="https://medanatomyunsw.github.io/SH_MSKThorax_SpellingBee/"><span class="icon circle">SB</span>Spelling Bee</a>
<a class="button purple" href="https://medanatomyunsw.github.io/SH_MSKThorax_Crossword/"><span class="icon">✚</span>Crossword</a>
<a class="button red" href="https://medanatomyunsw.github.io/SH_MSKThorax_Respirdle/"><span class="icon">R</span>Respirdle</a>
<a class="button teal" href="https://medanatomyunsw.github.io/SH_MSKThorax_WhoAmI/"><span class="icon">?</span>Who Am I?</a>
<a class="button orange" href="https://medanatomyunsw.github.io/SH_MSKThorax_AnatomyLadder/"><span class="icon">↟</span>Anatomy Ladder</a>
<a class="button slate" href="https://medanatomyunsw.github.io/SH_MSKThorax_AnatomyBlitz/"><span class="icon">⚡</span>Anatomy Blitz</a>
</div>
<p class="note">Choose a game to begin.</p></main></body></html>
