<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Phase 1 Anatomy Games</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:42px 20px;
  background:#f1f4f7;
  font-family:Arial,Helvetica,sans-serif;
  color:#2d2d2d;
}

.panel{
  width:min(900px,100%);
  margin:0 auto;
  background:#fff;
  border-radius:30px;
  box-shadow:0 18px 45px rgba(32,45,60,.12);
  padding:58px 60px 60px;
  text-align:center;
}

.brand{
  margin:0;
  color:#2459b8;
  font-size:clamp(2.5rem,5vw,3.3rem);
  font-weight:800;
}

.title{
  margin:18px 0 0;
  font-size:clamp(1.65rem,4vw,2.25rem);
  font-weight:400;
}

.back{
  display:block;
  width:fit-content;
  margin:0 0 27px;
  color:#2459b8;
  text-decoration:none;
  font-weight:700;
}

.back:hover{text-decoration:underline}

.course-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  margin-top:52px;
}

.course{
  min-height:120px;
  padding:18px 12px;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:#fff;
  box-shadow:0 6px 14px rgba(0,0,0,.08);
  transition:transform .15s ease,filter .15s ease,box-shadow .15s ease;
}

a.course:hover{
  transform:translateY(-3px);
  filter:brightness(1.04);
  box-shadow:0 10px 20px rgba(0,0,0,.13);
}

.code{
  font-size:clamp(1.25rem,2.8vw,1.7rem);
  font-weight:800;
  line-height:1.1;
}

.sub{
  margin-top:8px;
  font-size:.78rem;
  font-weight:700;
  line-height:1.2;
  opacity:.92;
}

.hma{background:#7cab70}
.aeb{background:#4b7fe3}
.sh{background:#b58a49}

.coming{
  background:#d9dde2;
  color:#68717a;
  box-shadow:none;
  cursor:default;
}

.coming .sub{
  opacity:1;
  font-weight:600;
}

.note{
  margin:46px 0 0;
  color:#555;
  font-size:1.05rem;
}

@media(max-width:520px){
  body{padding:18px 12px}
  .panel{padding:38px 18px 42px;border-radius:23px}
  .course-grid{gap:12px}
  .course{min-height:105px;border-radius:16px}
  .code{font-size:1.1rem}
  .sub{font-size:.72rem}
}
</style>
</head>

<body>
<main class="panel">
  <a class="back" href="index.html">← Anatomy Games Hub</a>

  <h1 class="brand">UNSW Anatomy</h1>
  <h2 class="title">Phase 1 Games</h2>

  <div class="course-grid">
    <div class="course coming">
      <div class="code">Foundations</div>
      <div class="sub">Coming soon!</div>
    </div>

    <a class="course sh" href="sh.html">
      <div class="code">SH</div>
      <div class="sub">Society &amp; Health</div>
    </a>

    <div class="course coming">
      <div class="code">BGDA</div>
      <div class="sub">Coming soon!</div>
    </div>

    <div class="course coming">
      <div class="code">BGDB</div>
      <div class="sub">Coming soon!</div>
    </div>

    <a class="course hma" href="hma.html">
      <div class="code">HMA</div>
    </a>

    <div class="course coming">
      <div class="code">HMB</div>
      <div class="sub">Coming soon!</div>
    </div>

    <div class="course coming">
      <div class="code">AEA</div>
      <div class="sub">Coming soon!</div>
    </div>

    <a class="course aeb" href="aeb.html">
      <div class="code">AEB</div>
    </a>
  </div>

  <p class="note">Choose a course to begin.</p>
</main>
</body>
</html>
